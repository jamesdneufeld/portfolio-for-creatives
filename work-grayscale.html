    <link rel="icon" type="image/svg+xml" href="assets/branding-images/favicon.svg" />

      <section class="portfolio">
        <ul class="grid">
          <li class="work-page-grid-item rounded-large">

          <li class="work-page-grid-item rounded-large">
            <a href="project-3.html" class="grayscale">

    </main>

    <!-- Shared footer -->
    <div id="footer-placeholder"></div>

    <!-- Shared header and footer -->
    <script>
      fetch("includes/header-1.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("header-placeholder").innerHTML = data;
        });

      fetch("includes/footer-1.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer-placeholder").innerHTML = data;
          document.getElementById("copyright-years").textContent += new Date().getFullYear();
        });
    </script>

    <div id="myID" class="bottomMenu hide"><a href="#">Back to top</a></div>

    <script type="text/javascript">
      const myID = document.getElementById("myID");

      var myScrollFunc = function () {
        var y = window.scrollY;
        if (y >= 800) {
          myID.className = "bottomMenu show";
        } else {
          myID.className = "bottomMenu hide";
        }
      };

      window.addEventListener("scroll", myScrollFunc);
    </script>
  </body>
</html>
